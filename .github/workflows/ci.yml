name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    # develop, not main: this repo integrates on develop, and
    # src/pocketrocks/_update_check.py treats develop's tip as the published
    # SDK version. develop merge commits are the ones needing a post-merge verdict.
    branches:
      - develop

concurrency:
  # PR runs share a per-ref group and cancel freely — a newer push supersedes.
  # Push runs get SHA-unique groups so each merge commit's run completes: it is
  # the only post-merge signal that commit will ever get.
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, type-check, test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --all-extras --python ${{ matrix.python-version }}

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src tests

      - name: Pytest
        run: uv run pytest

  floors:
    name: Dependency floors (lowest-direct)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Deliberately NOT --locked: the point is to resolve away from the lock,
      # down to the oldest versions our pyproject floors permit. A green lock
      # run plus a red floors run means our declared minimums are a lie.
      - name: Install at lowest direct versions
        run: uv sync --all-extras --resolution lowest-direct --python 3.10

      # --no-sync: plain `uv run` performs its own implicit sync at the
      # default "highest" resolution first, silently re-upgrading websockets
      # and python-dotenv back to their locked versions — so pytest would
      # never actually run against the floors installed above.
      - name: Pytest
        run: uv run --no-sync pytest

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --all-extras

      # Runs ruff-format, ruff, gitleaks and the hygiene hooks in one pass.
      # Deliberately not duplicated as separate ruff steps: .pre-commit-config.yaml
      # is the single definition of the gate, and a second copy here would drift.
      - name: Pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Lockfile is in sync with pyproject
        run: uv lock --check

  ci-ok:
    # Single required status check. Every job above is a dependency, so adding
    # a job to this workflow without adding it here silently removes it from
    # the merge bar — check this list when adding jobs in later slices.
    name: CI OK
    runs-on: ubuntu-latest
    needs: [lint, check, floors]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          # Check failure, cancelled, and skipped: a skipped job means its
          # checks never ran, and for a required status check that must not
          # read as success, or a later slice could add an `if:`-gated job
          # that gets silently skipped and still lets this gate go green.
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All required jobs succeeded."
