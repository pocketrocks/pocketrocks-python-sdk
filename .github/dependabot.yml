version: 2
updates:
  # Python deps. Fully enabled — unlike the pocketrocks monorepo, there is no
  # release freeze here and CI minutes are not a constraint.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Keeps .pre-commit-config.yaml hook revs from drifting away from uv.lock:
  # ruff, for example, is pinned in both places, and only this entry keeps
  # the pre-commit rev moving in step with the lockfile.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pre-commit:
        patterns:
          - "*"
