[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketrocks-python-sdk"
dynamic = ["version"]
description = "Python SDK for PocketRocks local bots"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.1",
  "websockets>=14",
  "python-dotenv>=1",
]

[project.optional-dependencies]
dev = [
  # mypy --strict is only clean with numpy >= 2.1 stubs; 1.26 stubs produce
  # 3 spurious errors, so don't "fix" those by touching src.
  "numpy>=2.1,<2.3",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "pocketrocks._version.__version__"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.format]
# Explicit rather than inherited: formatting is now a CI gate, so the settings
# it enforces should be visible in the file rather than implied by defaults.
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "F",      # pyflakes
  "I",      # import sorting
  "B",      # bugbear
  "UP",     # pyupgrade
  "S",      # bandit — security. Already referenced via `# noqa: S310`.
  "ASYNC",  # blocking calls inside async code: the bug class an asyncio SDK
            # exports to every bot author who copies our examples.
  "BLE",    # blind except. Selected so the existing `# noqa: BLE001` in
            # _update_check.py is a real suppression and not an unused-noqa
            # error under RUF100.
  "PT",     # pytest style
  "SIM",    # simplifiable constructs
  "C4",     # comprehensions
  "TID",    # tidy imports
  "RUF",    # ruff-specific, incl. RUF100 unused-noqa
]

[tool.ruff.lint.per-file-ignores]
# `assert` is the entire point of a test.
"tests/**" = ["S101"]
# Teaching material. Read top-to-bottom by newcomers, so it favours the
# obvious construct over the clever one, and it asserts to make failures loud.
# `random` here is deliberately non-cryptographic: it drives an example bot's
# play, not anything security-sensitive.
"examples/**" = ["S101", "S311"]
"starter/**" = ["S101"]
"benchmarks/**" = ["S101"]
# Golden-trace replay assertions. Lives under src/ because it shares the sim
# engine's internals, but it is only ever imported by
# tests/sim/test_conformance.py — effectively test code, not a library entry
# point, so `assert` is the right tool here too.
"src/pocketrocks/sim/traces.py" = ["S101"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
strict = true
warn_unused_configs = true
