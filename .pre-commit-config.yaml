# Commit-time gate. Deliberately cheap: everything here is staged-scoped or
# near-instant. There is no pre-push hook — the `lint` job in CI runs
# `pre-commit run --all-files`, so hooks are a convenience and CI is the
# enforcer. A contributor who never runs `pre-commit install` cannot land
# anything this file would have caught.
#
# `rev` values are managed by `uv run pre-commit autoupdate`.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      # Local secret scanning is best-effort by nature; the `secret-scan` CI
      # job re-runs it as the enforced gate, so `--no-verify` cannot bypass it.
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, chore, docs, refactor, perf, test, build, ci, revert, style]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: no-commit-to-branch
        args: [--branch, develop]
